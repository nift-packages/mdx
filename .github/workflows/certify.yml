name: MDX package certification
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mdx-certification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mdx
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: mdx
      - uses: actions/checkout@v6
        with:
          repository: nift-dev/nift
          ref: 1370a97b66a48af3a66d47d822800cdeb436c295
          path: core
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-winpthreads
      - name: Build unmodified Nift
        if: runner.os != 'Windows'
        run: make -C ../core -j2
      - name: Build unmodified Nift on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C ../core -j2
      - name: Windows runtime DLL path
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Install pinned optional runtime
        run: npm ci --ignore-scripts --prefix renderer
      - name: Configure executable and package paths
        shell: python
        run: |
          import os,pathlib
          root=pathlib.Path.cwd()
          (root/'investigation/checkpoints/CP13-profile-results.json').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('NIFT='+str(root.parent/'core'/('nift.exe' if os.name=='nt' else 'nift'))+'\n')
              f.write('MDX_NODE_MODULES='+str(root/'renderer/node_modules')+'\n')
      - name: Original parser regression
        shell: python
        run: |
          import os,subprocess,sys
          subprocess.run([sys.executable,'tests/test_mdx.py',os.environ['NIFT']],check=True)
      - name: Exact baseline parity
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'tests/test_parser_parity.py'],check=True)
      - name: Profile boundaries
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'tests/test_profiles.py'],check=True)
      - name: Rendering, transport, policy, cache and installed-site regression
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'tests/test_render.py'],check=True)
      - name: Standalone helper certification (independent of Nift installer)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import importlib.util,json,pathlib,platform,subprocess,unittest
          spec=importlib.util.spec_from_file_location('mdx_renderer_tests','tests/test_render.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          excluded={'test_installed_nift_facade','test_nift_dependency_invalidation_site','test_windows_native_input_paths'}
          suite=unittest.TestSuite(test for test in unittest.TestLoader().loadTestsFromTestCase(module.RendererTests) if test._testMethodName not in excluded)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          record={'platform':platform.system(),'node':subprocess.check_output(['node','--version'],text=True).strip(),'testsRun':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'success':result.wasSuccessful()}
          pathlib.Path('investigation/checkpoints/CP19-helper-result.json').write_text(json.dumps(record,indent=2)+'\n',encoding='utf-8')
          if not result.wasSuccessful():raise SystemExit(1)
      - name: Save certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdx-${{ runner.os }}-node${{ matrix.node }}
          path: |
            mdx/investigation/checkpoints/CP13-profile-results.json
            mdx/investigation/checkpoints/CP19-helper-result.json
